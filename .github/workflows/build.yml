name: build

# Construye y publica la imagen en GHCR.
# Diferencias de comportamiento entre push y pull_request:
#   • push a main → etiqueta sha + semver + latest, push a GHCR
#   • pull_request → solo build (no push). Sirve para que el PR tenga
#     evidencia de que la imagen compila, sin contaminar el registro
#     con imágenes de PRs.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # solo si realmente vamos a hacer push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/inventario-api

jobs:
  build:
    name: build & push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Estrategia de etiquetado:
          #   • sha-<7>  → siempre, para trazabilidad exacta del commit
          #   • semver   → si es un tag vX.Y.Z
          #   • latest   → solo en push a main
          tags: |
            type=sha,prefix=sha-
            type=raw,value={{branch}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=inventario-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push)
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: ./app
          file: ./app/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache: usa el registry cache si estamos pusheando, local en otro caso.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: true
          sbom: true
