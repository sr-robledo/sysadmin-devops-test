# Este compose "levanta" la aplicación, pero tiene bastantes problemas:
# de seguridad, de persistencia, de arranque y de mantenibilidad.
#
# Tu trabajo: convertirlo en algo que dejarías corriendo en un servidor
# de la Fundación. Justifica los cambios en ENTREGA.md.

version: "3"

services:

  db:
    image: postgres
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario123
    ports:
      - "5432:5432"

  api:
    build: ../app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: inventario
      DB_USER: inventario
      DB_PASSWORD: inventario123
    ports:
      - "8080:8080"
    depends_on:
      - db

  proxy:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    depends_on:
      - api
